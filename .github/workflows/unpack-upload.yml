name: Apply uploaded ZIP updates

on:
  push:
    paths:
      - "upload/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-uploaded-zip-updates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the branch that received the ZIP
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate and extract uploaded ZIP files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/process_uploads.py --upload-dir upload

      - name: Check extracted changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No ZIP updates were found, or the archive contained no net changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit and push extracted files
        if: steps.changes.outputs.changed == 'true'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Apply uploaded ZIP update"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "No staged changes to commit."
          fi

      - name: Report result
        if: always()
        shell: bash
        run: |
          {
            echo "## Forma Studio ZIP updater"
            echo ""
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Result: ${{ job.status }}"
            echo "- ZIP source: \`upload/*.zip\`"
            echo "- Processed archives are deleted from \`upload/\` after successful extraction."
          } >> "$GITHUB_STEP_SUMMARY"
