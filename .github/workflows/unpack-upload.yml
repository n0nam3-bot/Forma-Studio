name: Apply uploaded ZIP updates

on:
  push:
    paths:
      - 'upload/*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-uploaded-zip-updates
  cancel-in-progress: false

jobs:
  apply-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply uploaded ZIP files
        run: python3 scripts/process_uploads.py --upload-dir upload

      - name: Commit extracted 
changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No extracted changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply uploaded ZIP update"
          git push
